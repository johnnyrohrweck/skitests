:root{color-scheme:dark;--bg:#222;--fg:#fff;--mut:#a3a3a3;--card:#2c2c2c;--line:#3d3d3d;--acc:#5CC8F0;--bad:#ef7d74}
html,body{background:linear-gradient(180deg,#333 0%,#222 60%) fixed}
html,body{margin:0;background-color:var(--bg);color:var(--fg);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.w{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;box-sizing:border-box}
.c{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 22px;width:100%;max-width:360px;box-sizing:border-box}
h1{font-size:22px;margin:0 0 4px}p{margin:0 0 18px;color:var(--mut);font-size:15px}
input{width:100%;box-sizing:border-box;font-size:18px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
button{margin-top:12px;width:100%;font-size:17px;font-weight:600;padding:12px;border:0;border-radius:999px;background:var(--acc);color:#111}
.e{color:var(--bad);font-size:14px;min-height:20px;margin-top:10px}
</style>

const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));

async function entschluesseln(raw){
  const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(D.iv)},key,b(D.ct));
  return new TextDecoder().decode(buf);
}
function zeige(html){
  // Seite NICHT ersetzen (sonst vergisst das iPhone die Handy-Ansicht), sondern Inhalt einsetzen
  const doc=new DOMParser().parseFromString(html,'text/html');
  document.title=doc.title;
  if(doc.documentElement.lang) document.documentElement.lang=doc.documentElement.lang;
  const ls=document.getElementById('ladestil'); if(ls) ls.remove();
  const fix=document.createElement('style'); fix.textContent='html{-webkit-text-size-adjust:100%;text-size-adjust:100%}'; document.head.appendChild(fix);
  for(const el of doc.head.querySelectorAll('style,link[rel=stylesheet]')) document.head.appendChild(document.importNode(el,true));
  const body=document.importNode(doc.body,true);
  document.body.replaceWith(body);
  // Skripte neu anlegen, damit sie der Reihe nach laufen
  for(const alt of [...body.querySelectorAll('script')]){const n=document.createElement('script');n.textContent=alt.textContent;alt.replaceWith(n);}
}
async function ableiten(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return crypto.subtle.deriveBits({name:'PBKDF2',salt:b(D.salt),iterations:D.it,hash:'SHA-256'},base,256);
}

  let gespeichert=null;try{gespeichert=localStorage.getItem(K);}catch(e){}
  if(gespeichert){try{zeige(await entschluesseln(b(gespeichert)));return;}catch(e){try{localStorage.removeItem(K);}catch(_){}}}
  document.getElementById('w').hidden=false;

      const html=await entschluesseln(raw);try{localStorage.setItem(K,t(raw));}catch(e){}zeige(html);}
    catch(e){err.textContent='Passwort stimmt nicht.';}
  });
})();
