const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const t=s=>btoa(String.fromCharCode(...new Uint8Array(s)));

async function entschluesseln(raw){
  const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(D.iv)},key,b(D.ct));
  return new TextDecoder().decode(buf);
}
function zeige(html){document.open();document.write(html);document.close();}
async function ableiten(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return crypto.subtle.deriveBits({name:'PBKDF2',salt:b(D.salt),iterations:D.it,hash:'SHA-256'},base,256);
}
